# Focus Profile - Optimized for deep work

sensors:
  eye_tracking:
    enabled: true
    sample_rate: 30
  keystroke:
    enabled: true
  app_usage:
    enabled: true
  calendar:
    enabled: true
    source: "local"
  wearables:
    enabled: false
  voice:
    enabled: false

adaptations:
  notifications:
    enabled: true
    mode: "aggressive"  # Block most notifications
  ui_density:
    enabled: true
  app_blocking:
    enabled: true
    blocked_apps:
      - "slack"
      - "discord"
      - "twitter"
      - "facebook"
      - "reddit"
  breaks:
    enabled: true
    interval_minutes: 120  # Longer intervals for deep work
    duration_minutes: 10

privacy:
  data_retention_days: 7
  telemetry: false
  raw_data_storage: false

model:
  model_path: null
  window_size_seconds: 300
  prediction_horizon_seconds: 900
