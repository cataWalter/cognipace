<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 320px; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e8e8e8;
    }
    .header {
      padding: 16px;
      background: #0f3460;
      text-align: center;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .state-display {
      padding: 24px;
      text-align: center;
    }
    .state-emoji { font-size: 48px; margin-bottom: 8px; }
    .state-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .state-desc { font-size: 12px; color: #a0a0a0; }
    .load-bar {
      margin: 16px;
      background: #16213e;
      border-radius: 8px;
      overflow: hidden;
      height: 24px;
      position: relative;
    }
    .load-fill {
      height: 100%;
      border-radius: 8px;
      transition: width 0.3s ease;
    }
    .load-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      font-weight: 600;
    }
    .actions {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      background: #0f3460;
      color: #e8e8e8;
      transition: background 0.2s;
    }
    .btn:hover { background: #1a4a7a; }
    .btn-primary { background: #e94560; }
    .btn-primary:hover { background: #d63a52; }
    .status {
      padding: 12px 16px;
      font-size: 11px;
      color: #a0a0a0;
      border-top: 1px solid #16213e;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧠 CogniPace</h1>
  </div>
  
  <div class="state-display">
    <div class="state-emoji" id="stateEmoji">⚪</div>
    <div class="state-name" id="stateName">Waiting...</div>
    <div class="state-desc" id="stateDesc">Connect to CogniPace to see your cognitive state</div>
  </div>
  
  <div class="load-bar">
    <div class="load-fill" id="loadFill" style="width: 0%; background: #a0a0a0;"></div>
    <div class="load-text" id="loadText">0%</div>
  </div>
  
  <div class="actions">
    <button class="btn btn-primary" id="summarizeBtn">Summarize Page</button>
    <button class="btn" id="reduceUiBtn">Reduce UI Complexity</button>
    <button class="btn" id="openDashboard">Open Dashboard</button>
  </div>
  
  <div class="status" id="status">Status: Checking connection...</div>
  
  <script src="popup.js"></script>
</body>
</html>
